name: CodeQL

on:
  push:
    branches: [main]
  # No base-branch filter, so a layer of a stack is analysed like a pull
  # request on main.
  pull_request:
  schedule:
    # Weekly, so a newly published query still finds an idle repository.
    - cron: '31 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [go, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # codeql-bundle-v2.26.4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # codeql-bundle-v2.26.4
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # codeql-bundle-v2.26.4
        with:
          category: /language:${{ matrix.language }}
