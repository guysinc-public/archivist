version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels: ["dependencies", "go"]
    groups:
      go-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # go-crypto v1.5 raises the go directive to 1.25; archivist stays on Debian
      # stable's Go 1.24 (#21). Lift this when Debian stable ships Go 1.25.
      - dependency-name: "github.com/ProtonMail/go-crypto"
        versions: [">=1.5.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "github-actions"]
    groups:
      actions-all:
        patterns: ["*"]

  # The composite Action pins its own actions independently of the root workflows.
  - package-ecosystem: github-actions
    directory: /action
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "github-actions"]
